name: Release

on:
  push:
    tags: ["v*.*.*"]

# The verify job never sees the registry token. Publish is the only job that reads it.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny

      - name: Verify
        run: ./scripts/verify.sh

      - name: Package
        run: cargo publish --locked --dry-run

  release:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve the version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          CRATE=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$CRATE" != "$VERSION" ]; then
            echo "::error::Cargo.toml says $CRATE but the tag says $VERSION"
            exit 1
          fi

      # Slices the matching CHANGELOG section. The sed range this replaces terminated on the
      # *next* `## [` heading, so when the section was the last one in the file — which is
      # exactly the shape of a first release — the range ran to EOF and `sed '$d'` ate a
      # real line of the notes. awk stops at the next heading or at EOF, either way whole.
      - name: Extract the changelog section
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "body<<CHANGELOG_EOF"
            awk -v version="$VERSION" '
              index($0, "## [" version "]") == 1 { inside = 1; next }
              inside && /^## \[/ { exit }
              inside { print }
            ' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Idempotent on purpose. A release that fails *after* crates.io has accepted the crate
      # cannot be re-run otherwise: the second `cargo publish` errors on a version that is
      # already there and the GitHub Release never gets its turn. Publishing is the one step
      # in this pipeline that cannot be undone, so the step after it has to stay reachable.
      - name: Publish to crates.io
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set in the repository secrets"
            exit 1
          fi
          if curl -sfo /dev/null -A "molt-framework release workflow" \
               "https://crates.io/api/v1/crates/molt-framework/$VERSION"; then
            echo "::notice::molt-framework $VERSION is already on crates.io — skipping"
          else
            cargo publish --locked --no-verify
          fi

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ${{ steps.changelog.outputs.body }}

            ## Install

            ```toml
            [dependencies]
            molt-framework = "${{ steps.version.outputs.version }}"
            ```

            The library is imported as `molt`: `use molt::prelude::*;`

name: Release

on:
  push:
    tags: ["v*.*.*"]

# The verify job never gets a registry credential. Publish is the only job that can mint one,
# and it is short-lived: see the `id-token` permission and the auth step there.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `actions: read` lets the CI check below list workflow runs; nothing here can write.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Publishing cannot be undone, so refuse a tag that was not cut from reviewed code:
      # the commit must be on `main`, and the CI workflow must already have passed on it.
      - name: The tag must point at a commit on main
        run: |
          # `fetch-depth: 0` above already brought every branch, `origin/main` included.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Release from main."
            exit 1
          fi

      - name: CI must have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success \
                     --json databaseId --jq length)
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::No successful CI run for $GITHUB_SHA. Wait for CI on main to finish, then tag."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deny

      - name: Verify
        run: ./scripts/verify.sh

      - name: Package
        run: cargo publish --locked --dry-run

  release:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The named environment is what crates.io's Trusted Publisher entry is bound to, together
    # with this repository and this workflow file; it is also where required reviewers live.
    # GitHub creates it on first use; protecting it is a setting, not code (see SECURITY.md).
    environment: release
    permissions:
      contents: write
      # Lets the job request an OIDC token from GitHub, which crates.io exchanges for a
      # publish token valid for this job only. There is no long-lived secret.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Resolve the version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          CRATE=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$CRATE" != "$VERSION" ]; then
            echo "::error::Cargo.toml says $CRATE but the tag says $VERSION"
            exit 1
          fi

      # Slices the matching CHANGELOG section. The sed range this replaces terminated on the
      # *next* `## [` heading, so when the section was the last one in the file — which is
      # exactly the shape of a first release — the range ran to EOF and `sed '$d'` ate a
      # real line of the notes. awk stops at the next heading or at EOF, either way whole.
      - name: Extract the changelog section
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "body<<CHANGELOG_EOF"
            awk -v version="$VERSION" '
              index($0, "## [" version "]") == 1 { inside = 1; next }
              inside && /^## \[/ { exit }
              inside { print }
            ' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Idempotent on purpose. A release that fails *after* crates.io has accepted the crate
      # cannot be re-run otherwise: the second `cargo publish` errors on a version that is
      # already there and the GitHub Release never gets its turn. Publishing is the one step
      # in this pipeline that cannot be undone, so the step after it has to stay reachable.
      - name: Publish to crates.io
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if curl -sfo /dev/null -A "molt-framework release workflow" \
               "https://crates.io/api/v1/crates/molt-framework/$VERSION"; then
            echo "::notice::molt-framework $VERSION is already on crates.io — skipping"
          else
            cargo publish --locked --no-verify
          fi

      - name: Create the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          body: |
            ${{ steps.changelog.outputs.body }}

            ## Install

            ```toml
            [dependencies]
            molt-framework = "${{ steps.version.outputs.version }}"
            ```

            The library is imported as `molt`: `use molt::prelude::*;`

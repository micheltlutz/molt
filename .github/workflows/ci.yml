name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Read-only by default. No job here writes to the repository, so the token a pull request
# from a fork (or a compromised action) can use is limited to reading it.
permissions:
  contents: read

# A new push supersedes the run already in flight, so the queue does not fill with runs
# nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        toolchain: [stable, "1.85"]
    env:
      # `rust-toolchain.toml` pins `stable`, and rustup lets that file override the toolchain the
      # action installs. Without this variable (which outranks the file) the "1.85" legs ran on
      # stable, so the minimum supported Rust version was advertised and never tested.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: The compiler in use is the one this leg asks for
        if: matrix.toolchain != 'stable'
        run: |
          rustc --version
          rustc --version | grep -q "^rustc ${{ matrix.toolchain }}\." || {
            echo "::error::expected rustc ${{ matrix.toolchain }}.x but rustup selected another toolchain"
            exit 1
          }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked --all-features --verbose
      - run: cargo test --locked --no-default-features --verbose

  lint:
    name: Lint (fmt, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Gating, deliberately. A lint job that is allowed to fail leaves the badge green
      # while lint is failing.
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses sources

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: wasm-pack
      - run: cargo build --features wasm --target wasm32-unknown-unknown
      - run: wasm-pack test --node -- --features wasm
      # Builds all three targets and fails if the gzipped size exceeds the budget.
      - run: ./scripts/build-wasm.sh

  docsrs:
    name: docs.rs build (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same reason as the test matrix: the repository's `rust-toolchain.toml` would otherwise
      # select stable, which rejects `#![feature(doc_cfg)]`. docs.rs does not deny warnings, so
      # neither does this job (the workflow-level `-D warnings` is cleared).
      RUSTUP_TOOLCHAIN: nightly
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: The compiler in use is nightly
        run: |
          rustc --version
          rustc --version | grep -q nightly || { echo "::error::rustup did not select nightly"; exit 1; }
      # What docs.rs runs: nightly, every feature, `--cfg docsrs` (see `package.metadata.docs.rs`
      # in Cargo.toml). The crate uses `feature(doc_cfg)`, which only nightly accepts, so a
      # stable build cannot catch a break here, and a break means no documentation page at
      # all. Warnings are not denied (docs.rs does not deny them); an error fails the job.
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs

  package:
    name: Package (cargo publish --dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Builds the crate from the tarball crates.io would receive, so a file left out by
      # `exclude` or a broken manifest fails here instead of in the release job.
      - run: cargo publish --locked --dry-run

  verify:
    name: Verify (build, test, lint, catalog, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # `scripts/check-changelog.sh` compares with the last release tag, and a shallow
          # checkout has none, which would make it skip itself.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-deny
      - run: ./scripts/verify.sh

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

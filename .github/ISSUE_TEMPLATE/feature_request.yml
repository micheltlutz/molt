name: Feature request
description: Something the library should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the problem before the solution. What page are you building, and where
        does the library get in the way?
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What are you doing instead today?
      description: Even "I drop to `raw_text`" is useful — it tells us where the gap is.

  - type: textarea
    id: api
    attributes:
      label: What might the API look like?
      description: Optional. A sketch is fine.
      render: rust

  - type: dropdown
    id: swift-parity
    attributes:
      label: Does Winged-Swift already do this?
      description: >
        If so, name the Swift type or method — parity gaps are prioritised.
      options:
        - "No / I don't know"
        - "Yes — parity gap"

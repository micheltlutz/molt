# Thresholds stay at the project's defaults: red here means write a test.
#
# An arbitrary percentage gate teaches people to write tests that raise a number. The
# defaults plus a short, individually justified ignore list is a stronger signal.

ignore:
  # Exercised by `wasm-pack test --node`, which produces no native coverage data. Every
  # function here is a one-line delegation to a covered method on Element, Document or
  # SeoBuilder.
  - "src/wasm.rs"
